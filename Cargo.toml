[workspace]
members = ["crates/config", "crates/protocol", "crates/platform", "crates/core", "crates/cli", "crates/ffi"]
resolver = "2"
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_path_to_error = "0.1"
bytes = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
aes = "0.8"
cfb-mode = "0.8"
zeroize = { version = "1", features = ["derive"] }
ipnet = { version = "2", features = ["serde"] }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
blake2 = "0.10"
tracing = "0.1"
socket2 = { version = "0.6", features = ["all"] }
meta-config = { path = "crates/config" }
meta-protocol = { path = "crates/protocol" }
meta-platform = { path = "crates/platform" }
meta-core = { path = "crates/core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[patch.crates-io]
rustls = { path = "third-party/rustls" }
quinn-proto = { path = "third-party/quinn-proto" }
